name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Compilation et tests (Java 25)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer le JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
          cache: maven

      # Porte bloquante : la compilation et les tests doivent passer.
      - name: mvnw verify
        run: ./mvnw -B verify

      # Verifie que l'archive est bien executable, comme a l'exercice 5.1 bis.
      - name: Verifier le jar produit
        run: test -f target/mycoolapp-0.0.1-SNAPSHOT.jar

  secrets:
    name: Balayage des secrets (tout l'historique)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Historique complet : un secret retire au commit suivant y reste.
          fetch-depth: 0

      # Action tierce : epinglee au commit, pas au tag. Un tag est deplacable,
      # donc @v2 laisse un tiers changer le code execute ici. Les actions/* sont
      # publiees par GitHub et restent suivies par version majeure.
      # Pas de GITHUB_TOKEN : le balayage lit l'historique local, il n'appelle
      # pas l'API.
      - name: gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
