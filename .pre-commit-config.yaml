# Controles de pre-commit du depot.
# Installer : pre-commit install && pre-commit install --hook-type commit-msg
#
# Les memes controles sont rejoues en integration : contourner localement ne
# gagne rien et masque le defaut. Aucun contournement des crochets.
#
# Note : le crochet no-commit-to-branch du modele du socle est volontairement
# absent. Ce TP impose un commit par exercice directement sur main, sans
# branches de fonctionnalite ni demande de fusion.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^\.mvn/
      - id: end-of-file-fixer
        exclude: ^\.mvn/
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-xml
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-added-large-files
        args: [--maxkb=512]
      - id: detect-private-key
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  # Controles propres a la stack Java/Maven.
  - repo: local
    hooks:
      - id: commit-msg-convention
        name: convention du message de commit
        entry: scripts/hook-commit-msg.sh
        language: script
        stages: [commit-msg]

      - id: maven-test
        name: mvnw test (compilation + tests)
        entry: scripts/hook-maven-test.sh
        language: script
        pass_filenames: false
        files: ^(src/|pom\.xml$)
