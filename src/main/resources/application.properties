spring.application.name=mycoolapp

# Exercice 5.2 : proprietes personnalisees injectees par @Value.
coach.name=Mickey Mouse
team.name=The Mouse Club

# Exercice 5.3 : server.port=7070 et server.servlet.context-path=/mycoolapp ont
# ete testes puis retires, comme l'enonce l'autorise. Voir le commit 7cb7dba.
server.port=8080

# N'ecouter que sur la boucle locale. Tomcat se lie a 0.0.0.0 par defaut, donc
# l'application etait joignable depuis le reseau. Tous les tests de l'enonce
# passent par localhost, cette restriction ne coute rien et rend vraie
# l'affirmation de SECURITY.md.
server.address=127.0.0.1

# Exercice 5.5 : exposer tous les points de controle. Par defaut, seul health
# l'est. Reglage d'apprentissage : en production on restreint cette liste.
management.endpoints.web.exposure.include=*

# Sans cette ligne, /actuator/info repond 200 avec un objet vide : les
# proprietes info.* sont chargees mais leur publication est desactivee.
management.info.env.enabled=true

info.app.name=My Super Cool App
info.app.description=A crazy fun app, yoohoo!
info.app.version=1.0.0

# Exercice 5.6 : identifiants fixes a la place du mot de passe genere a chaque
# demarrage. Valeurs imposees par l'enonce. Voir SECURITY.md : un identifiant
# en clair dans un fichier suivi par git serait inacceptable hors de ce TP.
spring.security.user.name=abdou
spring.security.user.password=cHk3694
